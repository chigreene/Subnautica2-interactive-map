<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subnautica 2 Companion Map MVP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="panel">
      <h1>Subnautica 2 Companion Map</h1>
      <p class="muted">Local WebSocket feed: <code>ws://127.0.0.1:8787/ws</code></p>
      <div class="status-grid">
        <div><span>Status</span><strong id="connection">Disconnected</strong></div>
        <div><span>Source</span><strong id="source">--</strong></div>
        <div><span>X</span><strong id="x">0</strong></div>
        <div><span>Y</span><strong id="y">0</strong></div>
        <div><span>Z</span><strong id="z">0</strong></div>
        <div><span>Yaw</span><strong id="yaw">0</strong></div>
      </div>
      <p class="feed-warning" id="feedWarning" hidden></p>
    </section>

    <section class="map-wrap">
      <canvas id="map" width="1956" height="972"></canvas>
      <div class="map-readout" id="cursor">Hover the map</div>
    </section>

    <section class="panel controls">
      <h2>Map Calibration</h2>
      <p class="muted small">Initial calibration: raw memory X/Z are divided by 1000 for map placement; X east/right; Z north/up; 0.85 image pixels per map meter.</p>
      <label>Scale <input id="scale" type="number" step="0.01" value="0.85" /></label>
      <label>Raw units per map meter <input id="coordDivisor" type="number" step="1" value="1000" /></label>
      <label>Origin X <input id="originX" type="number" step="1" value="306" /></label>
      <label>Origin Y <input id="originY" type="number" step="1" value="556" /></label>
      <label>Map horizontal axis
        <select id="axisX">
          <option value="x">X</option>
          <option value="-x">-X</option>
          <option value="z">Z</option>
          <option value="-z">-Z</option>
        </select>
      </label>
      <label>Map vertical axis
        <select id="axisY">
          <option value="-z">-Z</option>
          <option value="z">Z</option>
          <option value="x">X</option>
          <option value="-x">-X</option>
        </select>
      </label>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
